name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 06:15 Israel time during daylight-saving time.
    - cron: "15 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Refresh data for scheduled and manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python dira-nuriot/update_all.py

      - name: Build dashboard for pushes
        if: github.event_name == 'push'
        run: python dira-nuriot/build_html.py

      - name: Verify publishable site
        run: test -f dira-nuriot/index.html

      - name: Prepare public site
        run: |
          mkdir _site
          cp dira-nuriot/index.html _site/index.html
          cp dira-nuriot/.nojekyll _site/.nojekyll
          if [ -f dira-nuriot/photo.jpg ]; then cp dira-nuriot/photo.jpg _site/photo.jpg; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
