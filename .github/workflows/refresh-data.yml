name: Refresh dashboard data

on:
  workflow_dispatch:
  schedule:
    # 06:15 Israel time during daylight-saving time.
    - cron: "15 3 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Refresh data and rebuild dashboard
        run: python dira-nuriot/update_all.py

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dira-nuriot/index.html
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push
